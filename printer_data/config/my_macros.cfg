[gcode_macro PRINT_END]
description: Safe end-of-print moves
gcode:
  M400       #Wait for buffer to clear

  {% if "xyz" in printer.toolhead.homed_axes %}
    _PARK_REAR_LEFT
    MOVE_BED_TO_MANAGE_HEIGHT
  {% endif %}

  M104 S0                      ; hotend off
  M140 S0                      ; bed off
  M84                          ; disable motors

[gcode_macro PRINT_START]
description: Heat, home, Z tilt, re-home Z, prime line (robust)
gcode:
  {% set bed = params.BED|default(60)|int %}
  {% set hotend = params.HOTEND|default(200)|int %}
  {% set warm = hotend - 20 if (hotend - 20) > 160 else 160 %}

  RESPOND TYPE=command MSG="Print received — heating bed {bed}C / nozzle {hotend}C."
  ; Optional audible "chirp" (requires homed axes, so we do it after G28)
  ; (leave commented for now)

  M140 S{bed}                 ; start heating bed (no wait)
  M104 S{hotend}              ; start heating hotend (no wait)

  G90                         ; absolute positioning
  M83                         ; extruder relative
  G92 E0

  RESPOND MSG="Homing..."
  G28                         ; home all axes

  ; Optional chirp now that we're homed:
  ; G91
  ; G1 X0.3 F18000
  ; G1 X-0.3 F18000
  ; G90

  RESPOND MSG="Waiting for bed..."
  M190 S{bed}                 ; wait for bed

  RESPOND MSG="Warming nozzle for leveling..."
  M109 S{warm}                ; warm nozzle (reduces ooze during probing)

  RESPOND MSG="Z tilt..."
  Z_TILT_ADJUST

  ; Important: re-home Z after Z_TILT
  G28 Z

  RESPOND MSG="Final nozzle heat..."
  M109 S{hotend}

  #RESPOND MSG="Priming..."
  #
  #; Create clearance – bed UP (Voron-style Z)
  #G91
  #G1 Z-5 F600
  #G90
  #
  #; Prime line
  #G1 X10 Y10 F9000
  #G1 Z0.28 F1200
  #G1 X200 E18 F1200
  #G1 Y12 F9000
  #G1 X10 E6 F1200
  #G92 E0



#####################################################################
# PARK / PAUSE / RESUME / LOAD / UNLOAD
#####################################################################

[gcode_macro _PARK_FRONT_CENTER]
description: Park toolhead at front-center, lift Z safely
variable_zlift: 10
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    RESPOND TYPE=error MSG="Not homed - refusing to park."
  {% else %}
    {% set x_mid = (printer.toolhead.axis_minimum.x + printer.toolhead.axis_maximum.x) / 2 %}
    {% set y_front = printer.toolhead.axis_minimum.y + 5 %}
    {% set z = printer.toolhead.position.z %}
    {% set zmax = printer.toolhead.axis_maximum.z %}
    {% set lift = zlift|float %}
    {% set z_safe = z + lift if (z + lift) < zmax else zmax %}

    G90
    G1 Z{z_safe|round(2)} F600
    G1 X{x_mid|round(2)} Y{y_front|round(2)} F9000
  {% endif %}

[gcode_macro _PARK_REAR_LEFT]
description: Park rear-left and lower bed 10mm (Z+)
variable_zdrop: 10
variable_x_margin: 5
variable_y_margin: 5
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    RESPOND TYPE=error MSG="Not homed - refusing to park."
  {% else %}
    {% set z_now = printer.toolhead.position.z|float %}
    {% set z_max = printer.toolhead.axis_maximum.z|float %}
    {% set z_target = z_now + (zdrop|float) %}
    {% if z_target > z_max %}{% set z_target = z_max %}{% endif %}

    {% set x_min = printer.toolhead.axis_minimum.x|float %}
    {% set y_max = printer.toolhead.axis_maximum.y|float %}
    {% set x_target = x_min + (x_margin|float) %}
    {% set y_target = y_max - (y_margin|float) %}

    G90
    G1 Z{z_target|round(2)} F600
    G1 X{x_target|round(2)} Y{y_target|round(2)} F9000
  {% endif %}

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    PAUSE_BASE
  {% else %}
    SAVE_GCODE_STATE NAME=PAUSE_STATE
    PAUSE_BASE
    M83
    G1 E-2 F1800
    _PARK_FRONT_CENTER
  {% endif %}

[gcode_macro RESUME]
rename_existing: RESUME_BASE
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    RESUME_BASE
  {% else %}
    M83
    G1 E2 F1800
    RESTORE_GCODE_STATE NAME=PAUSE_STATE MOVE=1 MOVE_SPEED=120
    RESUME_BASE
  {% endif %}

[gcode_macro LOAD_FILAMENT]
description: Park front-center then load filament (nozzle must be hot)
gcode:
  {% if printer.extruder.temperature < 170 %}
    RESPOND TYPE=error MSG="Nozzle too cold to load. Heat to >=170C."
  {% else %}
    SAVE_GCODE_STATE NAME=FIL_STATE
    _PARK_FRONT_CENTER
    M83
    G1 E30 F300
    G1 E15 F1200
    RESTORE_GCODE_STATE NAME=FIL_STATE MOVE=0
  {% endif %}

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
description: Cancel print, lower bed, park front-center
gcode:
  RESPOND TYPE=command MSG="Print cancelled — parking toolhead."

  TURN_OFF_HEATERS

  {% if "xyz" in printer.toolhead.homed_axes %}
    ; Lower bed slightly (Z+ = bed down)
    G91
    G1 Z10 F600
    G90

    ; Reuse existing park macro
    #_PARK_FRONT_CENTER
    _PARK_REAR_LEFT
    MOVE_BED_TO_MANAGE_HEIGHT

  {% endif %}

  CANCEL_PRINT_BASE


[gcode_macro UNLOAD_FILAMENT]
description: Park front-center then unload filament (nozzle must be hot)
gcode:
  {% if printer.extruder.temperature < 170 %}
    RESPOND TYPE=error MSG="Nozzle too cold to unload. Heat to >=170C."
  {% else %}
    SAVE_GCODE_STATE NAME=FIL_STATE
    _PARK_FRONT_CENTER
    M83
    G1 E-10 F1200
    G1 E-60 F300
    RESTORE_GCODE_STATE NAME=FIL_STATE MOVE=0
  {% endif %}

[gcode_macro BEEP]
description: Audible beep using tiny stepper movement
gcode:
  {% if "xyz" in printer.toolhead.homed_axes %}
    G91
    G1 X0.3 F18000
    G1 X-0.3 F18000
    G90
  {% endif %}


[gcode_macro MOVE_BED_TO_MANAGE_HEIGHT]
description: Lower bed to Z300 only if Z is known and currently <300. Never homes.
gcode:
    {% if "z" in printer.toolhead.homed_axes %}
        {% if printer.toolhead.position.z < 300 %}
            G90
            G1 Z300 F1200
        {% endif %}
    {% else %}
        {action_respond_info("BED_HEIGHT_TO_MANAGE: Z not homed/unknown, skipping to avoid crash")}
    {% endif %}
