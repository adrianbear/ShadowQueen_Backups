#####################################################################
# SKR 3 bring-up: X, Y, Z, Z1, Z2
# - X/Y real endstops, Z still dummy (no probe yet)
# - Safe for STEPPER_BUZZ + FORCE_MOVE + G28 X/Y (once verified)
#####################################################################
#[include MCU_SKR3.cfg] ##Moved to after SB2240_T4.cfg
#[include T0_EBB36.cfg]
[include mainsail.cfg]
[include DEBUG_Macros.cfg]

[include SB2240_T4.cfg] #contains tool 4 sepcific settings #      *******    used toolhead to test ShadowQueen
[include stealthburner_leds_T4.cfg] #             ********** used toolhead to test ShadowQueen
[include MCU_SKR3.cfg]
[include my_macros.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h743xx_260049000F51303232383230-if00

[exclude_object]

[printer]
kinematics: cartesian
max_velocity: 200 #Known safe
max_accel: 300 #Known safe
#max_velocity: 800 #mm/s (temporary test ceiling)
#max_accel: 1000 #temporary to test ceiling (still too high me thinks)

square_corner_velocity: 5

max_z_velocity: 5
max_z_accel: 50

[probe]
#Moved in from SDB2240_T4.cfg
pin: ^EBBCan4:t4_probe_pin

x_offset: 0 # X axis-sensor relative nozzle offset
y_offset: 0 # Y axis-sensor relative nozzle offset
#z_offset: 0 # Z axis-sensor relative nozzle offset

# drop_first_result: True # enable is on danger-klipper
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3


[safe_z_home]
home_xy_position: 250,245   # pick a spot near the middle of your bed
speed: 100
z_hop: 10
z_hop_speed: 10

[z_tilt]
z_positions:
  -48, 70     # front-left screw (outside bed, z)
  500, 70     # front-right screw (outside bed, z1)
  226, 618     # back-middle screw (outside bed, z2)

points:
  20, 100       # probe near front-left
  226, 480     # probe near back-middle
  450, 100      # probe near front-right

horizontal_move_z: 20 #10
speed: 120
retries: 5
retry_tolerance: 0.02

[bed_mesh]
speed: 120
horizontal_move_z: 10

mesh_min: 20, 100
mesh_max: 450, 480

probe_count: 5,5        # start with 5x5
algorithm: bicubic

fade_start: 1
fade_end: 10
fade_target: 0

# Allow manual moves without homing (temporary)
#[force_move]
#enable_force_move: True

[virtual_sdcard]
path: ~/printer_data/gcodes

[gcode_macro ELECTRONICS_FANS_ON]
gcode:
  SET_FAN_SPEED FAN=fan_a SPEED=1.0
  SET_FAN_SPEED FAN=fan_b SPEED=1.0
  SET_FAN_SPEED FAN=fan_c SPEED=1.0

[gcode_macro ELECTRONICS_FANS_ON_HALF]
gcode:
  SET_FAN_SPEED FAN=fan_a SPEED=0.5
  SET_FAN_SPEED FAN=fan_b SPEED=0.5
  SET_FAN_SPEED FAN=fan_c SPEED=0.5
  
[gcode_macro ELECTRONICS_FANS_OFF]
gcode:
  SET_FAN_SPEED FAN=fan_a SPEED=0
  SET_FAN_SPEED FAN=fan_b SPEED=0
  SET_FAN_SPEED FAN=fan_c SPEED=0


[delayed_gcode STARTUP_FANS]
initial_duration: 1.0
gcode:
  ELECTRONICS_FANS_ON_HALF

[include moonraker_obico_macros.cfg]
