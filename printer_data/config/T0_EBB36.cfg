# This file contains common pin mappings for the BIGTREETECH EBBCan
# Canbus board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB0/PB1)".
# The "EBB Can" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

[mcu T0]
#serial: /dev/serial/by-id/usb-Klipper_Klipper_firmware_12345-if00
canbus_uuid: 77f2c66517e2

[temperature_sensor T0_mcu]
sensor_type: temperature_mcu
sensor_mcu: T0

[adxl345]
cs_pin: T0: PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,y,z

[probe]
pin: ^T0:PB6     # or PB5, PB6 or PB7
x_offset: 0
y_offset: 0
z_offset: 0     # Placeholder, will be replaced by SAVE_CONFIG
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0


[extruder]
step_pin: T0:PD0
dir_pin: T0:PD1
enable_pin: !T0:PD2

microsteps: 16
rotation_distance: 46.967
gear_ratio: 9:1
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: T0:PB13
#sensor_type: EPCOS 100K B57560G104F #from sample file
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: T0:PA3
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 300
max_power: 1.0

# sensor_type:MAX31865
# sensor_pin: T0: PA4
# spi_bus: spi1
# rtd_nominal_r: 100
# rtd_reference_r: 430
# rtd_num_of_wires: 2

[tmc2209 extruder]
uart_pin: T0: PA15
run_current: 0.650
stealthchop_threshold: 999999

[fan]
pin: T0:PA0

[heater_fan hotend_fan]
pin: T0: PA1
heater: extruder
heater_temp: 50.0

