# This file contains common pin mappings for the BIGTREETECH EBBCan
# Canbus board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB0/PB1)".
# The "EBB Can" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

[mcu EBBCan4]
#serial: /dev/serial/by-id/usb-Klipper_Klipper_firmware_12345-if00
canbus_uuid: 99e3d554687b #UPDATE THIS   3408133a314d

[temperature_sensor SB2240_Temp]
sensor_type: Generic 3950
sensor_pin: EBBCan4:PA2

[adxl345]
cs_pin: EBBCan4:PB12
spi_software_sclk_pin: EBBCan4:PB10
spi_software_mosi_pin: EBBCan4:PB11
spi_software_miso_pin: EBBCan4:PB2
axes_map: z,-y,x

#manually sourced from Input Shaper tuning on ShadowQueen (20260119)
[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 23.0
shaper_type_y: mzv
shaper_freq_y: 23.0


[resonance_tester]
probe_points: 226, 226, 20
accel_chip: adxl345

## NEW Section combining new and old settings (20240704)
[extruder]
step_pin: EBBCan4:PD0
dir_pin: EBBCan4:PD1  # Make sure to check the direction, if it's incorrect, remove the '!' sign. #removed the ! 20240710
enable_pin: !EBBCan4:PD2
microsteps: 16  # Updated based on Galileo2
rotation_distance: 47.088  # Updated based on Galileo2
gear_ratio: 9:1  # Updated based on clockwork2
full_steps_per_rotation: 200  # Based on old config
nozzle_diameter: 0.600
filament_diameter: 1.75
heater_pin: EBBCan4:PB13
sensor_type: ATC Semitec 104NT-4-R025H42G  # Updated based on old config
sensor_pin: EBBCan4:PA3
control: pid
#pid_Kp: 21.527  # Initial values, may need tuning
#pid_Ki: 1.063  # Initial values, may need tuning
#pid_Kd: 108.982  # Initial values, may need tuning
#After tuning on ShadowQueen
pid_Kp: 35.282
pid_Ki: 4.612
pid_Kd:67.479

pressure_advance: 0.040

min_temp: 10  # Updated based on old config
max_temp: 300  # Updated based on old config
max_power: 1.0  # Carried over from old config
min_extrude_temp: 170  # Carried over from old config
max_extrude_only_distance: 60 #increasing from default of 50 (ABear 20240721)

[tmc2240 extruder]
cs_pin: EBBCan4:PA15
spi_software_sclk_pin: EBBCan4:PB10
spi_software_mosi_pin: EBBCan4:PB11
spi_software_miso_pin: EBBCan4:PB2
driver_TPFD: 0
run_current: 0.6
stealthchop_threshold: 999999

[fan] #[fan_generic part_cooling_Fan]
pin: EBBCan4:PA1
kick_start_time: 0.5
##  Depending on your fan, you may need to increase this value
##  if your fan will not start. Can change cycle_time (increase)
##  if your fan is not able to slow down effectively
off_below: 0.10


[heater_fan hotend_fan]
pin: EBBCan4:PA0
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0


#[neopixel T4_hotend_rgb]
#pin: EBBCan4:PD3

#[input_pin probe_pin]
#pin: ^EBBCan4:PC13
#pullup: true

[board_pins t4_pins]
mcu: EBBCan4
aliases:
  t4_probe_pin=PC13

## NPN and PNP proximity switch types can be set by jumper
#[probe]
#pin: ^EBBCan4:PC13

##tool: 4
#x_offset: 0 # X axis-sensor relative nozzle offset
#y_offset: 0 # Y axis-sensor relative nozzle offset
#z_offset: 0 # Z axis-sensor relative nozzle offset

# drop_first_result: True # enable is on danger-klipper
#speed: 5.0
#samples: 3
#samples_result: median
#sample_retract_dist: 2.0
#samples_tolerance: 0.02
#samples_tolerance_retries: 3
